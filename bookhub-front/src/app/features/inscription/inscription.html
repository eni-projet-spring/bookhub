<main class="inscription">

  <section class="inscription__card">

    <h1 class="page-title inscription__title">
      Créer un compte
    </h1>

    <p class="inscription__subtitle">
      Complétez le formulaire ci-dessous pour créer votre compte BookHub.
    </p>

    <form class="inscription__form">

      <div class="form-group">
        <label class="form-label" for="nom">Nom</label>

        <input
          class="form-control"
          id="nom"
          type="text"
          placeholder="Dupont"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="prenom">Prénom</label>

        <input
          class="form-control"
          id="prenom"
          type="text"
          placeholder="Jean"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Adresse e-mail</label>

        <input
          class="form-control"
          id="email"
          type="email"
          placeholder="jean.dupont@email.com"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          Mot de passe
        </label>

        <input
          class="form-control"
          id="password"
          type="password"
          placeholder="Votre mot de passe"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">
          Confirmer le mot de passe
        </label>

        <input
          class="form-control"
          id="confirmPassword"
          type="password"
          placeholder="Confirmez votre mot de passe"
          autocomplete="new-password"
        >
      </div>

      <button
        class="btn btn--primary inscription__submit"
        type="submit"
      >
        Créer mon compte
      </button>

    </form>

  </section>

</main>
