<section class="history">
  <header class="history__header">
    <div>
      <h1>Mon historique</h1>
      <p>
        Retrouvez les livres que vous avez déjà empruntés et partagez votre avis.
      </p>
    </div>

    <div class="history__count">
      <span>Livres retournés</span>
      <strong>2</strong>
    </div>
  </header>

  <div class="history__list">
    <article class="history-card">
      <div class="history-card__cover history-card__cover--first">
        DUNE
      </div>

      <div class="history-card__content">
        <header>
          <div>
            <h2>Dune</h2>
            <p>Frank Herbert</p>
          </div>

          <span class="history-card__status">
            Retourné
          </span>
        </header>

        <dl class="history-card__details">
          <div>
            <dt>Emprunté le</dt>
            <dd>20 juin 2026</dd>
          </div>

          <div>
            <dt>Retourné le</dt>
            <dd>12 juillet 2026</dd>
          </div>
        </dl>

        <button type="button">
          Laisser un avis
        </button>
      </div>
    </article>

    <article class="history-card">
      <div class="history-card__cover history-card__cover--second">
        1984
      </div>

      <div class="history-card__content">
        <header>
          <div>
            <h2>1984</h2>
            <p>George Orwell</p>
          </div>

          <span class="history-card__status">
            Retourné
          </span>
        </header>

        <dl class="history-card__details">
          <div>
            <dt>Emprunté le</dt>
            <dd>10 juin 2026</dd>
          </div>

          <div>
            <dt>Retourné le</dt>
            <dd>28 juin 2026</dd>
          </div>
        </dl>

        <button type="button" class="history-card__button--secondary">
          Modifier mon avis
        </button>
      </div>
    </article>
  </div>
</section>
