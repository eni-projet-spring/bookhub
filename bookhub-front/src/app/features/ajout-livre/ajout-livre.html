<section class="ajout-livre">
  <h1 class="page-title">Ajouter un livre</h1>

  <form
    class="ajout-livre__form"
    [formGroup]="formulaireLivre"
    (ngSubmit)="ajouterLivre()"
  >
    <div class="ajout-livre__field">
      <label class="form-label" for="isbn">ISBN *</label>

      <input
        class="form-control"
        id="isbn"
        type="text"
        formControlName="isbn"
        maxlength="13"
        placeholder="9782070368228"
      >

      @if (
        formulaireLivre.controls.isbn.touched
        && formulaireLivre.controls.isbn.invalid
        ) {
        <small class="form-error">
          L’ISBN doit contenir exactement 13 caractères.
        </small>
      }
    </div>

    <div class="ajout-livre__field">
      <label class="form-label" for="titre">Titre *</label>

      <input
        class="form-control"
        id="titre"
        type="text"
        formControlName="titre"
        maxlength="100"
      >
    </div>

    <div class="ajout-livre__field">
      <label class="form-label" for="auteur">Auteur *</label>

      <input
        class="form-control"
        id="auteur"
        type="text"
        formControlName="auteur"
        maxlength="100"
      >
    </div>

    <div class="ajout-livre__field">
      <label class="form-label" for="edition">Édition *</label>

      <input
        class="form-control"
        id="edition"
        type="text"
        formControlName="edition"
        maxlength="100"
      >
    </div>

    <div class="ajout-livre__field">
      <label class="form-label" for="description">Description *</label>

      <textarea
        class="form-control"
        id="description"
        formControlName="description"
        maxlength="400"
        rows="5"
      ></textarea>
    </div>

    <div class="ajout-livre__field">
      <span class="form-label">Couverture du livre</span>

      <div class="couverture-upload">
        <!-- Hidden native file input for accessibility and functionality -->
        <input
          type="file"
          id="couvertureFile"
          class="couverture-upload__input"
          accept="image/jpeg, image/png, image/webp"
          (change)="onFileSelected($event)"
          aria-label="Sélectionner une image de couverture"
        />

        <!-- Styled label acting as the trigger button -->
        <label
          for="couvertureFile"
          class="couverture-upload__button"
          [class.couverture-upload__button--selected]="selectedFile"
        >
          {{ selectedFile ? 'Couverture sélectionnée' : 'Choisir une image' }}
        </label>

        <!-- Image Preview -->
        @if (previewUrl) {
          <img
            [src]="previewUrl"
            alt="Aperçu de la couverture sélectionnée"
            class="couverture-upload__preview"
          />
        }
      </div>
    </div>

    <div class="ajout-livre__field">
      <label class="form-label" for="idCategorie">Catégorie *</label>
      <select class="form-control" id="idCategorie" formControlName="idCategorie">
        <option [ngValue]="1">Roman</option>
        <option [ngValue]="2">Science-fiction</option>
        <option [ngValue]="3">Policier</option>
        <option [ngValue]="4">Biographie</option>
      </select>
    </div>

    <div class="ajout-livre__actions">
      <button
        class="btn btn--primary"
        type="submit"
        [disabled]="envoiEnCours"
      >
        {{ envoiEnCours ? 'Ajout en cours...' : 'Ajouter le livre' }}
      </button>
    </div>
  </form>

  @if (messageSucces) {
    <p class="form-success" role="status">
      {{ messageSucces }}
    </p>
  }

  @if (messageErreur) {
    <p class="form-error" role="alert">
      {{ messageErreur }}
    </p>
  }
</section>
