<div class="dashboard-layout">

  <!-- SIDEBAR -->
  <aside class="dashboard-layout__sidebar">

    <nav
      class="sidebar-nav"
      aria-label="Navigation bibliothécaire"
    >

      <!-- DASHBOARD -->
      <a
        class="sidebar-nav__link sidebar-nav__link--active"
        routerLink="/dashboard-bibliothecaire"
      >
        <svg
          class="sidebar-nav__icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 9.5 12 3l9 6.5"></path>
          <path d="M5 10v10h14V10"></path>
        </svg>

        <span>Dashboard</span>
      </a>

      <!-- AJOUTER UN LIVRE -->
      <a
        class="sidebar-nav__link"
        routerLink="/livres/ajouter"
      >
        <svg
          class="sidebar-nav__icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"
          ></path>

          <path
            d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"
          ></path>
        </svg>

        <span>Ajouter un livre</span>
      </a>

      <!-- EMPRUNTS -->
      <a
        class="sidebar-nav__link"
        routerLink="/emprunts-retard"
      >
        <svg
          class="sidebar-nav__icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M17 1l4 4-4 4"></path>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <path d="M7 23l-4-4 4-4"></path>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>

        <span>Emprunts</span>
      </a>

      <!-- LISTE DES RÉSERVATIONS -->
      <a
        class="sidebar-nav__link"
        routerLink="/listes-reservations"
      >
        <svg
          class="sidebar-nav__icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"
          ></path>
        </svg>

        <span>Réservations</span>
      </a>

      <!-- STATISTIQUES -->
      <a
        class="sidebar-nav__link"
        routerLink="/dashboard-bibliothecaire"
        fragment="statistiques"
      >
        <svg
          class="sidebar-nav__icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="6" y1="20" x2="6" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="18" y1="20" x2="18" y2="14"></line>
        </svg>

        <span>Statistiques</span>
      </a>

      <!-- PROFIL -->
      <a
        class="sidebar-nav__link"
        routerLink="/gestion-profil"
      >
        <svg
          class="sidebar-nav__icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
        </svg>

        <span>Mon profil</span>
      </a>

    </nav>

  </aside>
<main>
  <section class="gestion-profil">
    <h1 class="gestion-profil__title">Mon profil</h1>

    <p *ngIf="chargementEnCours" class="gestion-profil__loading" role="status">
    </p>

    <form
      class="gestion-profil__form"
      [formGroup]="formulaireProfil"
      (ngSubmit)="enregistrer()"
      novalidate
    >
      <div class="gestion-profil__field">
        <label class="gestion-profil__label" for="nom">Nom</label>
        <input
          class="gestion-profil__input"
          id="nom"
          type="text"
          formControlName="nom"
        />
      </div>

      <div class="gestion-profil__field">
        <label class="gestion-profil__label" for="prenom">Prénom</label>
        <input
          class="gestion-profil__input"
          id="prenom"
          type="text"
          formControlName="prenom"
        />
      </div>

      <div class="gestion-profil__field">
        <label class="gestion-profil__label" for="motDePasse">Nouveau mot de passe</label>
        <input
          class="gestion-profil__input"
          id="motDePasse"
          type="password"
          formControlName="motDePasse"
          placeholder="Changer de mot de passe"
          autocomplete="new-password"
          aria-describedby="motDePasse-erreur"
        />
        <p
          *ngIf="formulaireProfil.get('motDePasse')?.invalid && formulaireProfil.get('motDePasse')?.touched"
          id="motDePasse-erreur"
          class="gestion-profil__field-error"
        >
          Le mot de passe doit contenir au moins 6 caractères.
        </p>
      </div>

      <div class="gestion-profil__field">
        <label class="gestion-profil__label" for="motDePasse">Confirmer mot de passe</label>
        <input
          class="gestion-profil__input"
          id="motDePasse"
          type="password"
          formControlName="motDePasse"
          aria-describedby="motDePasse-erreur"
        />
        <p
          *ngIf="formulaireProfil.get('motDePasse')?.invalid && formulaireProfil.get('motDePasse')?.touched"
          id="motDePasse-erreur"
          class="gestion-profil__field-error"
        >
          Le mot de passe doit contenir au moins 6 caractères.
        </p>
      </div>

      <p *ngIf="messageErreur" class="gestion-profil__message gestion-profil__message--error" role="alert">
        {{ messageErreur }}
      </p>
      <p *ngIf="messageSucces" class="gestion-profil__message gestion-profil__message--success" role="status">
        {{ messageSucces }}
      </p>

      <div class="gestion-profil__actions">
        <button
          class="gestion-profil__button gestion-profil__button--primary"
          type="submit"
          [disabled]="chargementEnCours"
        >
          Enregistrer
        </button>
        <button
          class="gestion-profil__button gestion-profil__button--danger"
          type="button"
          (click)="supprimer()"
        >
          Supprimer mon compte
        </button>
      </div>
    </form>
  </section>
</main>
</div>
