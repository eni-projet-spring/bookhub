<div *ngIf="chargementEnCours">Chargement...</div>

<form [formGroup]="formulaireProfil" (ngSubmit)="enregistrer()">
  <label>
    Nom
    <input type="text" formControlName="nom" />
  </label>

  <label>
    Prénom
    <input type="text" formControlName="prenom" />
  </label>

  <label>
    Email
    <input type="email" formControlName="email" />
  </label>
  <p *ngIf="formulaireProfil.get('email')?.invalid && formulaireProfil.get('email')?.touched" class="erreur">
    Email invalide
  </p>

  <p *ngIf="messageErreur" class="erreur">{{ messageErreur }}</p>
  <p *ngIf="messageSucces" class="succes">{{ messageSucces }}</p>

  <button type="submit" [disabled]="chargementEnCours">Enregistrer</button>
  <button type="button" (click)="supprimer()">Supprimer mon compte</button>
</form>
