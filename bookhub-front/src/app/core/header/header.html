<header class="header">
  <div class="header__top">

    <a routerLink="/" aria-label="Retour à l'accueil">
      <img
        class="header__logo"
        src="images/main-logo.png"
        alt="Logo de la librairie"
      >
    </a>

    <form class="search-form">
      <input
        type="search"
        placeholder="Rechercher un livre, un auteur..."
      >

      <button type="submit" aria-label="Rechercher">
        <img src="logos/search.svg" alt="">
      </button>
    </form>

    @if (!estConnecte()) {
      <a
        class="account-btn"
        routerLink="/connexion"
        aria-label="Se connecter"
        title="Connexion"
      >
        <img src="logos/account.svg" alt="">
      </a>
    }

    @if (estConnecte()) {
      <button
        type="button"
        class="account-btn"
        aria-label="Se déconnecter"
        title="Déconnexion"
        (click)="seDeconnecter()"
      >
        <img src="logos/account.svg" alt="">
      </button>
    }

  </div>

  <div class="header__bottom">

    <select aria-label="Choisir une catégorie">
      <option>Catégories</option>
      <option>Roman</option>
      <option>Fantasy</option>
      <option>Science-fiction</option>
      <option>Policier</option>
      <option>Manga</option>
      <option>Histoire</option>
      <option>Jeunesse</option>
    </select>

    <nav>
      <ul>
        <li>
          <a routerLink="/">Accueil</a>
        </li>

        <li>
          <a routerLink="/contact">Nous contacter</a>
        </li>

        @if (!estConnecte()) {
          <li>
            <a routerLink="/connexion">Connexion</a>
          </li>

          <li>
            <a routerLink="/inscription">Inscription</a>
          </li>
        }

        @if (estConnecte()) {
          <li>
            <button
              type="button"
              class="logout-btn"
              (click)="seDeconnecter()"
            >
              Déconnexion
            </button>
          </li>
        }
      </ul>
    </nav>

  </div>
</header>
